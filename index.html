    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 space-y-4 sm:space-y-6">

        <!-- 顶部核心数据对比卡片 -->
        <section id="summaryCards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-4">

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
            
            <div class="lg:col-span-5 space-y-4 sm:space-y-6">
                
                <!-- 录入与编辑卡片 -->

                    <form id="recordForm" class="space-y-3">

                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                        <!-- 指标选择器 -->

                                <option value="waistNarrow">腰围-最细 (cm)</option>

                                <option value="avg">均值</option>
                                <option value="last">末值</option>
                            </select>
                        </div>

                    <!-- Chart Canvas -->

                    </div>
                    <ol class="list-decimal list-inside space-y-1 pl-1 text-slate-500">
                        <li>用自带浏览器或 Chrome 打开此网页</li>
                        <li>点击右上角菜单 <strong>“⋮”</strong> 或底部选项</li>

            <button id="confirmGuideBtn" class="w-full py-2.5 bg-indigo-600 text-white font-medium text-xs rounded-xl shadow-md">

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-6 right-1/2 transform translate-x-1/2 sm:translate-x-0 sm:right-6 translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 z-50 whitespace-nowrap">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">提示信息</span>

    <script>
        const STORAGE_KEY = 'body_metrics_data_v2';
        
        const metricConfigs = {
            weight: { label: '体重', unit: 'kg', color: '#6366f1' },
            waistNavel: { label: '腰围-肚脐', unit: 'cm', color: '#f59e0b' },
            waistNarrow: { label: '腰围-最细', unit: 'cm', color: '#ec4899' },
            thigh: { label: '大腿围', unit: 'cm', color: '#10b981' },
            calf: { label: '小腿围', unit: 'cm', color: '#06b6d4' }
        };

        let records = [];
        let currentFrame = 'day';
        let chartInstance = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadRecords();
            initDateInput();
            initChart();
            bindEvents();
            renderAll();
        });

        function loadRecords() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                records = data ? JSON.parse(data) : getMockData();
                sortRecordsByDate();
            } catch (e) {
                console.error('读取数据失败', e);
                records = [];
            }
        }

        function saveRecords() {
            sortRecordsByDate();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            renderAll();
        }

        function sortRecordsByDate() {
            records.sort((a, b) => new Date(a.date) - new Date(b.date));
        }

        function initDateInput() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
        }

        function getMockData() {
            const list = [];
            const now = new Date();
            for (let i = 28; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const diff = (28 - i);
                list.push({
                    date: dateStr,
                    weight: parseFloat((70.5 - diff * 0.08 + Math.sin(i) * 0.2).toFixed(1)),
                    waistNavel: parseFloat((82.0 - diff * 0.09 + Math.cos(i) * 0.3).toFixed(1)),
                    waistNarrow: parseFloat((76.0 - diff * 0.07 + Math.sin(i) * 0.2).toFixed(1)),
                    thigh: parseFloat((55.0 - diff * 0.04).toFixed(1)),
                    calf: parseFloat((37.0 - diff * 0.02).toFixed(1))
                });
            }
            return list;
        }

        function renderAll() {
            renderSummaryCards();
            renderRecordList();
            updateChart();
        }

        function renderSummaryCards() {
            const container = document.getElementById('summaryCards');
            container.innerHTML = '';

            if (records.length === 0) {
                container.innerHTML = `<div class="col-span-full py-4 text-center text-xs text-slate-400 bg-white rounded-xl border border-slate-200">暂无数据，请添加记录</div>`;
                return;
            }

            const latest = records[records.length - 1];
            const initial = records[0];

            const latestDate = new Date(latest.date);
            const weekAgoDate = new Date(latestDate); weekAgoDate.setDate(weekAgoDate.getDate() - 7);

            const lastWeekRec = findClosestRecord(weekAgoDate);

            Object.keys(metricConfigs).forEach(key => {
                const cfg = metricConfigs[key];
                const currentVal = latest[key];
                const initialVal = initial ? initial[key] : null;
                const weekVal = lastWeekRec ? lastWeekRec[key] : null;

                const diffInitial = (currentVal !== null && initialVal !== null) ? (currentVal - initialVal).toFixed(1) : null;
                const diffWeek = (currentVal !== null && weekVal !== null) ? (currentVal - weekVal).toFixed(1) : null;

                const cardHtml = `
                    <div class="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${cfg.label}</div>
                            <div class="text-base sm:text-lg font-black text-slate-900 mt-0.5">
                                ${currentVal !== undefined && currentVal !== null ? currentVal : '--'}
                                <span class="text-[10px] font-normal text-slate-500">${cfg.unit}</span>
                            </div>
                        </div>
                        
                        <div class="mt-2 pt-1.5 border-t border-slate-100 text-[10px] space-y-0.5">
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">较初始:</span>
                                ${formatDiffBadge(diffInitial)}
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">较上周:</span>
                                ${formatDiffBadge(diffWeek)}
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function findClosestRecord(targetDate) {
            if (records.length === 0) return null;
            return records.reduce((closest, item) => {
                const itemDate = new Date(item.date);
                const closestDate = new Date(closest.date);
                return Math.abs(itemDate - targetDate) < Math.abs(closestDate - targetDate) ? item : closest;
            });
        }

        function formatDiffBadge(diff) {
            if (diff === null || isNaN(diff)) return `<span class="text-slate-300">--</span>`;
            const num = parseFloat(diff);
            if (num === 0) return `<span class="text-slate-500 font-semibold">0</span>`;
            
            const isDown = num < 0;
            const colorClass = isDown ? 'text-emerald-600 bg-emerald-50' : 'text-rose-600 bg-rose-50';
            const icon = isDown ? '↓' : '↑';
            return `<span class="px-1 py-0.5 rounded font-bold ${colorClass}">${icon} ${Math.abs(num)}</span>`;
        }

        function renderRecordList() {
            const listEl = document.getElementById('recordList');
            document.getElementById('recordCount').textContent = `${records.length} 条`;

            if (records.length === 0) {
                listEl.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">暂无任何数据记录</div>`;
                return;
            }

            const reversed = [...records].reverse();
            listEl.innerHTML = reversed.map((rec) => {
                const originalIndex = records.findIndex(r => r.date === rec.date);
                return `
                    <div class="p-2.5 bg-slate-50 hover:bg-indigo-50/40 rounded-xl transition-all border border-slate-100 flex items-center justify-between">
                        <div class="space-y-0.5">
                            <div class="text-xs font-bold text-slate-800 flex items-center gap-1">
                                <i class="fa-regular fa-calendar text-indigo-500 text-[10px]"></i>
                                ${rec.date}
                            </div>
                            <div class="flex flex-wrap gap-x-2 gap-y-0.5 text-[10px] text-slate-500">
                                ${rec.weight ? `<span>体: <strong class="text-slate-700">${rec.weight}</strong></span>` : ''}
                                ${rec.waistNavel ? `<span>脐: <strong class="text-slate-700">${rec.waistNavel}</strong></span>` : ''}
                                ${rec.waistNarrow ? `<span>细: <strong class="text-slate-700">${rec.waistNarrow}</strong></span>` : ''}
                                ${rec.thigh ? `<span>腿: <strong class="text-slate-700">${rec.thigh}</strong></span>` : ''}
                                ${rec.calf ? `<span>小腿: <strong class="text-slate-700">${rec.calf}</strong></span>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            <button onclick="editRecord(${originalIndex})" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-white transition-colors">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteRecord(${originalIndex})" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-white transition-colors">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function initChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            padding: 8,
                            cornerRadius: 8,
                            titleFont: { size: 11, weight: 'bold' },
                            bodyFont: { size: 11 }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 9 }, color: '#64748b' }
                        },
                        y: {
                            grid: { color: '#f1f5f9' },
                            ticks: { font: { size: 9 }, color: '#64748b' }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!chartInstance) return;

            const metric = document.getElementById('metricSelect').value;
            const mode = document.getElementById('aggregateMode').value;
            const cfg = metricConfigs[metric];

            const processedData = aggregateData(records, metric, currentFrame, mode);

            document.getElementById('chartRangeInfo').textContent = `${processedData.labels.length} 个数据节点`;

            chartInstance.data.labels = processedData.labels;
            chartInstance.data.datasets = [{
                label: `${cfg.label} (${cfg.unit})`,
                data: processedData.values,
                borderColor: cfg.color,
                backgroundColor: cfg.color + '15',
                fill: true,
                tension: 0.3,
                borderWidth: 2,
                pointBackgroundColor: cfg.color,
                pointRadius: processedData.labels.length > 20 ? 1.5 : 3,
                pointHoverRadius: 5
            }];

            chartInstance.update();
        }

        function aggregateData(dataList, metric, frame, aggMode) {
            if (dataList.length === 0) return { labels: [], values: [] };

            if (frame === 'day') {
                return {
                    labels: dataList.map(r => r.date),
                    values: dataList.map(r => r[metric] !== undefined ? r[metric] : null)
                };
            }

            const groups = {};

            dataList.forEach(item => {
                if (item[metric] === null || item[metric] === undefined) return;
                
                let key = '';
                const d = new Date(item.date);

                if (frame === 'week') {
                    const year = d.getFullYear();
                    const firstJan = new Date(year, 0, 1);
                    const dayNum = Math.floor((d - firstJan) / (24 * 60 * 60 * 1000));
                    const weekNum = Math.ceil((dayNum + firstJan.getDay() + 1) / 7);
                    key = `${year}-W${weekNum < 10 ? '0' + weekNum : weekNum}`;
                } else if (frame === 'month') {
                    key = item.date.substring(0, 7);
                }

                if (!groups[key]) groups[key] = [];
                groups[key].push(item[metric]);
            });

            const labels = Object.keys(groups);
            const values = labels.map(key => {
                const arr = groups[key];
                if (arr.length === 0) return null;
                if (aggMode === 'last') {
                    return arr[arr.length - 1];
                } else {
                    const sum = arr.reduce((a, b) => a + b, 0);
                    return parseFloat((sum / arr.length).toFixed(1));
                }
            });

            return { labels, values };
        }

        function bindEvents() {
            document.getElementById('recordForm').addEventListener('submit', (e) => {
                e.preventDefault();
                saveFormData();
            });

            document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
            document.getElementById('metricSelect').addEventListener('change', updateChart);
            document.getElementById('aggregateMode').addEventListener('change', updateChart);

            document.getElementById('timeFrameBtns').addEventListener('click', (e) => {
                const btn = e.target.closest('.time-frame-btn');
                if (!btn) return;

                document.querySelectorAll('.time-frame-btn').forEach(b => {
                    b.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                    b.classList.add('text-slate-600');
                });
                btn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                btn.classList.remove('text-slate-600');

                currentFrame = btn.dataset.frame;
                
                const modeSelect = document.getElementById('aggregateMode');
                if (currentFrame === 'day') {
                    modeSelect.classList.add('hidden');
                } else {
                    modeSelect.classList.remove('hidden');
                }

                updateChart();
            });

            document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
            document.getElementById('importJsonInput').addEventListener('change', importJSON);

            // 弹窗引导逻辑
            const guideModal = document.getElementById('guideModal');
            const guideModalCard = document.getElementById('guideModalCard');
            
            const openModal = () => {
                guideModal.classList.remove('opacity-0', 'pointer-events-none');
                guideModalCard.classList.remove('translate-y-10');
            };
            const closeModal = () => {
                guideModal.classList.add('opacity-0', 'pointer-events-none');
                guideModalCard.classList.add('translate-y-10');
            };

            document.getElementById('guideBtn').addEventListener('click', openModal);
            document.getElementById('closeGuideBtn').addEventListener('click', closeModal);
            document.getElementById('confirmGuideBtn').addEventListener('click', closeModal);
        }

        function saveFormData() {
            const date = document.getElementById('inputDate').value;
            const weight = parseFloat(document.getElementById('inputWeight').value) || null;
            const waistNavel = parseFloat(document.getElementById('inputWaistNavel').value) || null;
            const waistNarrow = parseFloat(document.getElementById('inputWaistNarrow').value) || null;
            const thigh = parseFloat(document.getElementById('inputThigh').value) || null;
            const calf = parseFloat(document.getElementById('inputCalf').value) || null;

            if (!date) {
                showToast('请选择日期', 'error');
                return;
            }

            const editIndex = parseInt(document.getElementById('editIndex').value);
            const newRecord = { date, weight, waistNavel, waistNarrow, thigh, calf };

            if (editIndex >= 0) {
                records[editIndex] = newRecord;
                showToast('记录更新成功');
            } else {
                const existingIdx = records.findIndex(r => r.date === date);
                if (existingIdx >= 0) {
                    records[existingIdx] = newRecord;
                    showToast('覆盖更新同日期记录');
                } else {
                    records.push(newRecord);
                    showToast('保存成功');
                }
            }

            saveRecords();
            resetForm();
        }

        window.editRecord = function(index) {
            const item = records[index];
            if (!item) return;

            document.getElementById('editIndex').value = index;
            document.getElementById('inputDate').value = item.date;
            document.getElementById('inputWeight').value = item.weight || '';
            document.getElementById('inputWaistNavel').value = item.waistNavel || '';
            document.getElementById('inputWaistNarrow').value = item.waistNarrow || '';
            document.getElementById('inputThigh').value = item.thigh || '';
            document.getElementById('inputCalf').value = item.calf || '';

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-600"></i> 编辑数据 (${item.date})`;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('saveSubmitBtn').innerHTML = `<i class="fa-solid fa-rotate"></i> 更新数据`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteRecord = function(index) {
            if (confirm(`确定要删除 ${records[index].date} 的记录吗？`)) {
                records.splice(index, 1);
                saveRecords();
                showToast('记录已删除');
            }
        };

        function resetForm() {
            document.getElementById('editIndex').value = '-1';
            document.getElementById('recordForm').reset();
            initDateInput();

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-600"></i> 登记今日测量`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('saveSubmitBtn').innerHTML = `<i class="fa-solid fa-check"></i> 保存数据`;
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `body_metrics_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('备份文件导出成功');
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        saveRecords();
                        showToast('恢复数据成功！');
                    } else {
                        showToast('文件格式不符合要求', 'error');
                    }
                } catch (err) {
                    showToast('解析失败，请检查文件格式', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            toastIcon.className = type === 'error' ? 'fa-solid fa-circle-xmark text-rose-400' : 'fa-solid fa-circle-check text-emerald-400';

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
